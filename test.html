<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카페 안내</title>
    <!-- 부트스트랩 CSS 링크 -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        /* 슬라이더 스타일 */
        .slider {
            width: 100%;
            height: 600px;
            position: relative;
            overflow: hidden;
            background-color: #333;
        }

        .slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            height: 600px;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 슬라이더 버튼 */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.5);
            border: none;
            padding: 10px;
            cursor: pointer;
            z-index: 2;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }

        /* 인덱스 바 스타일 */
        .slider-index {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
        }

        .index-bar {
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
        }

        .index-bar.active {
            background-color: #ff9900;
        }

        .card {
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }

        .card:hover {
            background-color: #ffe0b2;
        }

        .container {
            margin-top: 50px;
        }

        /* 리스트 스타일 복원 */
        ul {
            list-style-type: disc; /* 기본 원형 불릿 스타일 */
            padding-left: 20px; /* 왼쪽 여백 추가 */
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 슬라이더 -->
        <div class="slider">
            <div class="slides">
                <div class="slide">
                    <img src="assets/images/cafe-banner.jpeg" alt="슬라이드 1">
                </div>
                <div class="slide">
                    <img src="assets/images/church.jpg" alt="슬라이드 2">
                </div>
                <div class="slide">
                    <img src="assets/images/image3.jpg" alt="슬라이드 3">
                </div>
            </div>
            <button class="slider-btn prev">&#10094;</button>
            <button class="slider-btn next">&#10095;</button>

            <div class="slider-index">
                <div class="index-bar active"></div>
                <div class="index-bar"></div>
                <div class="index-bar"></div>
            </div>
        </div>

        <!-- 카페 안내 섹션 -->
        <div class="row mt-5">
            <div class="col-12 text-center">
                <h2>카페 안내</h2>
                <p>여기에서 카페의 주요 정보를 확인하세요.</p>
            </div>
        </div>

        <div class="row">
            <!-- 메뉴 설명 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title">메뉴 설명</h2>
                        <ul>
                            <li>커피</li>
                            <li>수제 디저트</li>
                            <li>밀크티</li>
                            <li>공간 예약 및 케이터링 서비스 제공</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- 이용 안내 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title">이용 안내</h2>
                        <ul>
                            <li>오픈: 오전 8:30</li>
                            <li>마감: 오후 9:30</li>
                            <li>전화: 02-888-3122</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- 부트스트랩 JS, Popper.js, jQuery 링크 -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.7/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        let currentIndex = 0;
        const slides = document.querySelector('.slides');
        const totalSlides = document.querySelectorAll('.slide').length;

        function showSlide(index) {
            slides.style.transform = `translateX(-${index * 100}%)`;
            document.querySelectorAll('.index-bar').forEach((bar, idx) => {
                bar.classList.toggle('active', idx === index);
            });
        }

        document.querySelector('.next').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % totalSlides;
            showSlide(currentIndex);
        });

        document.querySelector('.prev').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
            showSlide(currentIndex);
        });

        document.querySelectorAll('.index-bar').forEach((bar, idx) => {
            bar.addEventListener('click', () => {
                currentIndex = idx;
                showSlide(currentIndex);
            });
        });

        setInterval(() => {
            currentIndex = (currentIndex + 1) % totalSlides;
            showSlide(currentIndex);
        }, 3000); // 3초마다 슬라이드 자동 전환
    </script>

</body>
</html>
